# Install once with: pre-commit install (brew install pre-commit swiftlint xcodegen)
# The same hooks run in CI (`pre-commit run --all-files`).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: '\.xcodeproj/'
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
        exclude: '\.xcodeproj/'

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: no-api-key-files
        name: never commit Garmin API keys
        language: fail
        entry: "API key files must not be committed; keep the key in the Keychain"
        files: '(^|/)(\.apikey|.*\.apikey|connect-personal-api-key|\.env)$'

      - id: no-suppression-comments
        name: no swiftlint:disable / swift-format-ignore / unchecked concurrency escapes
        language: pygrep
        entry: 'swiftlint:(disable|enable)|swift-format-ignore|@unchecked\s+Sendable|nonisolated\(unsafe\)|@preconcurrency|unsafeBitCast'
        types: [swift]

      - id: xcodegen
        name: the Xcode project matches project.yml
        language: system
        entry: bash -c 'xcodegen generate --quiet && git diff --exit-code -- GCPAPISync.xcodeproj'
        files: ^(project\.yml|GCPAPISync\.xcodeproj/)
        pass_filenames: false

      - id: swift-format
        name: swift-format (strict)
        language: system
        entry: swift format lint --strict --parallel
        types: [swift]

      - id: swiftlint
        name: SwiftLint (every opt-in rule, strict)
        language: system
        entry: swiftlint lint --strict --quiet
        types: [swift]
        pass_filenames: false

      - id: tests
        name: build (warnings are errors) and test on the iOS simulator
        language: system
        entry: Scripts/test.sh
        pass_filenames: false
        always_run: true
        stages: [pre-push]
